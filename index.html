<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>KIET Attendance - CyberVidya</title>
    <meta
      name="description"
      content="Check your KIET CyberVidya attendance in one place: overall percentage, course-wise breakdown, calendar view and a bunk planner. An unofficial student tool."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://kietcybervidya.pages.dev/" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KIET Attendance" />
    <meta property="og:title" content="KIET Attendance - CyberVidya" />
    <meta
      property="og:description"
      content="Check your KIET CyberVidya attendance in one place: overall percentage, course-wise breakdown, calendar view and a bunk planner."
    />
    <meta property="og:url" content="https://kietcybervidya.pages.dev/" />
    <meta property="og:image" content="https://kietcybervidya.pages.dev/icons/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KIET Attendance - CyberVidya" />
    <meta
      name="twitter:description"
      content="Check your KIET CyberVidya attendance in one place: overall percentage, course-wise breakdown, calendar view and a bunk planner."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "KIET Attendance - CyberVidya",
        "url": "https://kietcybervidya.pages.dev/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any"
      }
    </script>
  </head>
  <body>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch {}
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <h1>KIET Attendance - CyberVidya</h1>
      <p>
        Check your KIET CyberVidya attendance: overall percentage, course-wise
        breakdown, calendar view and a bunk planner. This is an unofficial
        student tool and is not affiliated with CyberVidya. Please enable
        JavaScript to use it.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
