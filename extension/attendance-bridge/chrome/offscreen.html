<!doctype html>

     real CyberVidya page without any window or tab being shown. The sandbox
     lets the page run its scripts but stops it navigating this page away. -->
<meta charset="utf-8" />
<title>Attendance Bridge</title>
<iframe
	title="CyberVidya"
	src="https://kiet.cybervidya.net/login"
	sandbox="allow-scripts allow-same-origin allow-forms"
></iframe>
