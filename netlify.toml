[build]
  command = "bun run build"
  publish = "dist"

# Plain CDN-level passthrough proxy (no custom function/compute involved),
# as a third, distinct network path to test against CyberVidya's WAF.
[[redirects]]
  from = "/api/*"
  to = "https://kiet.cybervidya.net/api/:splat"
  status = 200
  force = true
